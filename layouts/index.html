{{ partial "header.html" . }}

<div class="flex flex-1 w-full">
  {{ partial "sidebar.html" . }}

  <section class="flex-1 px-4 py-8 md:p-10 font-mono text-white">
    <div class="max-w-5xl">
      <div class="overflow-hidden rounded-xl border border-green-800 bg-black/20 shadow-lg">
        <div class="border-b border-green-400/30 bg-green-500/5 px-8 py-6">
          <h1 class="text-3xl font-bold text-green-400">
            {{ .Title }}
          </h1>
        </div>

        <div class="px-8 py-8 leading-relaxed">
          <div class="text-gray-200 leading-7">
            {{ .Content }}
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

{{ partial "footer.html" . }}
