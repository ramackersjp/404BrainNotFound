<aside class="hidden md:block sticky top-16 h-[calc(100vh-4rem)] w-64 border-r border-green-500 p-6 font-mono text-green-400 bg-slate-950 overflow-y-auto">
  <div class="mb-6 flex flex-col items-center">
    <img
      src="/images/profile.jpg"
      alt="Profile"
      class="mb-4 h-24 w-24 rounded-full border-2 border-green-500 object-cover"
    >
    <h2 class="text-center font-bold">{{ .Site.Title }}</h2>
  </div>

  <form action="{{ "/search/" | relURL }}" method="get" class="mb-4">
    <label for="sidebar-search" class="sr-only">Search</label>
    <input
      id="sidebar-search"
      type="text"
      name="q"
      placeholder="> search..."
      class="w-full rounded-lg border border-green-500/50 bg-slate-900 px-3 py-2 text-sm text-green-300 placeholder-green-600 focus:border-green-400 focus:outline-none"
    >
  </form>

  <nav class="flex flex-col space-y-2">
    <a
      href="/"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>

    <a
      href="/about/"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Who am I?</span>
    </a>

    <a
      href="/contact/"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      <span>Contact</span>
    </a>

    <a
      href="{{ "/posts/" | relURL }}"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Blog</span>
    </a>

    <a
      href="/about/"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </svg>
      <span>About</span>
    </a>
  </nav>

  <div class="mt-6 space-y-2">
    <a href="#" target="_blank" class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300">
      <img src="/images/x.png" width="24" height="24">
      <span>X</span>
    </a>

    <a href="https://git.jpramackers.nl" target="_blank" class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300">
      <img src="/images/git.png" width="24" height="24">
      <span>Git</span>
    </a>

    <a href="#" target="_blank" class="flex items-center gap-4 rounded-lg px-4 py-3 text-gray-300 transition-all duration-200 hover:translate-x-1 hover:bg-green-500/10 hover:text-green-300">
      <img src="/images/facebook.png" width="24" height="24">
      <span>Facebook</span>
    </a>
  </div>
</aside>
