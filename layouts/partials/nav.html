<header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-green-500 shadow-md">
  <div class="w-full max-w-none mx-0 flex items-center justify-between p-4">

    <a href="{{ "/" | relURL }}"
       title="J.P. Ramackers"
       class="inline-block border border-green-500 rounded-lg px-2.5 py-1 text-xl font-mono text-green-500 hover:text-white hover:bg-green-500 hover:shadow-[0_0_12px_rgba(34,197,94,0.4)] transition-all duration-200">
      {{ .Site.Title }}
    </a>

    {{ $home := .IsHome }}
    {{ $section := .CurrentSection.RelPermalink }}

    <nav class="hidden md:flex items-center gap-1 font-mono">
      <a href="{{ "/" | relURL }}"
         class="rounded-lg px-4 py-1.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if $home }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
        Home
      </a>

      <a href="{{ "/posts/" | relURL }}"
         class="rounded-lg px-4 py-1.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/posts/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
        Blog
      </a>

      <a href="{{ "/about/" | relURL }}"
         class="rounded-lg px-4 py-1.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/about/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
        About
      </a>

      <a href="{{ "/contact/" | relURL }}"
         class="rounded-lg px-4 py-1.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/contact/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
        Contact
      </a>
    </nav>

    <button class="md:hidden text-green-500 hover:text-white transition-colors duration-200 focus:outline-none"
            type="button"
            aria-label="Open menu">
      <svg class="w-6 h-6"
           fill="none"
           stroke="currentColor"
           viewBox="0 0 24 24"
           xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7">
        </path>
      </svg>
    </button>

  </div>

  <nav id="mobile-menu"
       class="hidden flex-col gap-1 p-4 pt-0 md:hidden font-mono">

    <a href="{{ "/" | relURL }}"
       class="rounded-lg px-4 py-2.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if $home }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
      Home
    </a>

    <a href="{{ "/posts/" | relURL }}"
       class="rounded-lg px-4 py-2.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/posts/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
      Blog
    </a>

    <a href="{{ "/about/" | relURL }}"
       class="rounded-lg px-4 py-2.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/about/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
      About
    </a>

    <a href="{{ "/contact/" | relURL }}"
       class="rounded-lg px-4 py-2.5 transition-all duration-200 hover:bg-green-500/10 hover:text-green-300{{ if eq $section "/contact/" }} bg-green-500/15 text-green-300{{ else }} text-green-500{{ end }}">
      Contact
    </a>

  </nav>

  <script>
    const button = document.querySelector('[aria-label="Open menu"]');
    const menu = document.getElementById('mobile-menu');

    button.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  </script>
</header>
