{{ partial "header.html" . }}

<div class="flex flex-1 w-full">
  {{ partial "sidebar.html" . }}

  <section class="flex-1 p-10 font-mono text-green-400">
    <div class="max-w-5xl">

      <h1 class="text-3xl font-bold mb-8 border-b border-green-800 pb-4">
        Search
      </h1>

      <input
        id="search-input"
        type="text"
        placeholder="Search posts..."
        class="w-full p-3 bg-slate-900 border border-green-500 text-green-500 font-mono focus:outline-none mb-8"
      >

      <div id="search-results" class="space-y-6"></div>

    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script src="/js/search.js"></script>

{{ partial "footer.html" . }}
