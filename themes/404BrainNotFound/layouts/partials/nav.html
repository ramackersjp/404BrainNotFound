<header class="sticky top-0 z-40 bg-slate-950 shadow-md border-b border-green-500">
  <div class="w-full max-w-none mx-0 flex items-center justify-between p-4">

    <a href="{{ "/" | relURL }}"
       title="J.P. Ramackers"
       class="inline-block border border-green-500 rounded px-2 py-1 text-xl font-mono text-green-500 hover:text-white hover:bg-green-500 transition-colors duration-200">
      {{ .Site.Title }}
    </a>

    <nav class="hidden md:flex items-center space-x-2 font-mono">
      <a href="{{ "/" | relURL }}"
         class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
        Home
      </a>

      <a href="{{ "/posts/" | relURL }}"
         class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
        Blog
      </a>

      <a href="{{ "/about/" | relURL }}"
         class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
        About
      </a>

      <a href="{{ "/contact/" | relURL }}"
         class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
        Contact
      </a>

      <a href="{{ "/search/" | relURL }}"
         aria-label="Search"
         class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-5 h-5"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </a>
    </nav>

    <div class="md:hidden flex items-center gap-4">

      <a href="{{ "/search/" | relURL }}"
         aria-label="Search"
         class="text-green-500 hover:text-white transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </a>

      <button class="text-green-500 focus:outline-none"
              type="button"
              aria-label="Open menu">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7">
          </path>
        </svg>
      </button>

    </div>

  </div>

  <nav id="mobile-menu"
       class="hidden flex-col space-y-2 p-4 md:hidden font-mono">

    <a href="{{ "/" | relURL }}"
       class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
      Home
    </a>

    <a href="{{ "/posts/" | relURL }}"
       class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
      Blog
    </a>

    <a href="{{ "/about/" | relURL }}"
       class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
      About
    </a>

    <a href="{{ "/contact/" | relURL }}"
       class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">
      Contact
    </a> 

  </nav>

  <script>
    const button = document.querySelector('[aria-label="Open menu"]');
    const menu = document.getElementById('mobile-menu');

    button.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  </script>
</header>
