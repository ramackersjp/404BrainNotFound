<header class="sticky top-0 z-40 bg-slate-950 shadow-md border-b border-green-500">
   <div class="w-full max-w-none mx-0 flex items-center justify-between p-4">
    <a href="{{ "/" | relURL }}" title="J.P. Ramackers" class="inline-block border border-green-500 rounded px-2 py-1 text-xl font-mono text-green-500 hover:text-white hover:bg-green-500 transition-colors duration-200">
      {{ .Site.Title }}
    </a>

    <nav class="hidden md:flex space-x-2 font-mono">
      <a href="{{ "/" | relURL }}" class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Home</a>
      <a href="{{ "/posts/" | relURL }}" class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Blog</a>
      <a href="{{ "/about/" | relURL }}" class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">About</a>
      <a href="{{ "/contact/" | relURL }}" class="text-green-500 px-3 py-1 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Contact</a>
    </nav>

  <nav id="mobile-menu" class="hidden flex flex-col space-y-2 p-4 md:hidden font-mono">
    <a href="{{ "/" | relURL }}" class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Home</a>
    <a href="{{ "/posts/" | relURL }}" class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Blog</a>
    <a href="{{ "/about/" | relURL }}" class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">About</a>
    <a href="{{ "/contact/" | relURL }}" class="text-green-500 px-3 py-2 border border-transparent hover:border-green-500 hover:bg-green-500 hover:text-white transition-colors duration-200">Contact</a>
  </nav>

    <div class="md:hidden">
      <button class="text-green-500 focus:outline-none" type="button" aria-label="Open menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
  const button = document.querySelector('[aria-label="Open menu"]');
  const menu = document.getElementById('mobile-menu');

  button.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });
</script>
</header>
